        html, body {

            margin: 0;
            color: #D1A75F;
        }

        }
        .centered-content p {

            color: white;
        }
        .centered-content button {
            margin-top: 20px;
            padding: 10px 25px;
            background: white;
            color: black;
            font-weight: bold;
            border: none;
            cursor: pointer;
            border-radius: 4px;
        }
        .sidebar-icons {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 15px;

        .sidebar-icons div {
